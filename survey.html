<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Usage Survey | PlasticTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">🌱 PlasticTrack</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="survey.html">Survey</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="challenge.html">Challenge</a>
        </div>
    </nav>

    <!-- Survey Section -->
    <section class="survey-section">

        <div class="survey-header">
            <p class="eyebrow">PLASTIC USAGE CHECK</p>

            <h1 id="surveyTitle">Measure Your Plastic Usage</h1>

            <p id="surveyDescription">
                Answer these simple questions to understand your current plastic usage.
            </p>
        </div>

        <div class="survey-card">

            <form id="surveyForm">

                <!-- Question 1 -->
                <div class="question">
                    <label>
                        1. How often do you use plastic water bottles?
                    </label>

                    <select required>
                        <option value="">Select an option</option>
                        <option value="3">Every day</option>
                        <option value="2">Sometimes</option>
                        <option value="1">Rarely</option>
                        <option value="0">Never</option>
                    </select>
                </div>

                <!-- Question 2 -->
                <div class="question">
                    <label>
                        2. How often do you use plastic carry bags?
                    </label>

                    <select required>
                        <option value="">Select an option</option>
                        <option value="3">Every day</option>
                        <option value="2">Sometimes</option>
                        <option value="1">Rarely</option>
                        <option value="0">Never</option>
                    </select>
                </div>

                <!-- Question 3 -->
                <div class="question">
                    <label>
                        3. How often do you use disposable plastic cups or plates?
                    </label>

                    <select required>
                        <option value="">Select an option</option>
                        <option value="3">Every day</option>
                        <option value="2">Sometimes</option>
                        <option value="1">Rarely</option>
                        <option value="0">Never</option>
                    </select>
                </div>

                <!-- Question 4 -->
                <div class="question">
                    <label>
                        4. How often do you buy food or snacks with plastic packaging?
                    </label>

                    <select required>
                        <option value="">Select an option</option>
                        <option value="3">Every day</option>
                        <option value="2">Sometimes</option>
                        <option value="1">Rarely</option>
                        <option value="0">Never</option>
                    </select>
                </div>

                <!-- Question 5 -->
                <div class="question">
                    <label>
                        5. How often do you use reusable bottles or bags?
                    </label>

                    <select required>
                        <option value="">Select an option</option>
                        <option value="0">Always</option>
                        <option value="1">Sometimes</option>
                        <option value="2">Rarely</option>
                        <option value="3">Never</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn">
                    Calculate My Score →
                </button>

            </form>

        </div>

        <!-- Result -->
        <div id="result" class="result-card" style="display: none;">

            <h2>Your Plastic Usage Score</h2>

            <div id="score" class="big-score">0 / 15</div>

            <h3 id="level"></h3>

            <p id="message"></p>

            <div id="nextAction"></div>

        </div>

    </section>

    <footer>
        <p>© 2026 PlasticTrack | Track. Reduce. Reuse.</p>
    </footer>


    <script>

        const form = document.getElementById("surveyForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const selects = document.querySelectorAll("select");

            let totalScore = 0;

            selects.forEach(function(select) {
                totalScore += Number(select.value);
            });


            /* --------------------------------
               CHECK SURVEY STAGE
            -------------------------------- */

            const urlParams = new URLSearchParams(window.location.search);

            const stage = urlParams.get("stage");


            /* --------------------------------
               FIRST / BASELINE SURVEY
            -------------------------------- */

            if (stage !== "after") {

                localStorage.setItem("beforeScore", totalScore);

                // Keep current score for dashboard
                localStorage.setItem("plasticScore", totalScore);

            }


            /* --------------------------------
               AFTER SURVEY
            -------------------------------- */

            else {

                localStorage.setItem("afterScore", totalScore);

                // Keep current score for dashboard
                localStorage.setItem("plasticScore", totalScore);

            }


            /* --------------------------------
               DISPLAY RESULT
            -------------------------------- */

            document.getElementById("result").style.display = "block";

            document.getElementById("score").textContent =
                totalScore + " / 15";


            let level = "";
            let message = "";


            if (totalScore <= 4) {

                level = "🌱 Low Plastic Usage";

                message =
                    "Great job! Your plastic usage is already low. Keep following sustainable habits.";

            }

            else if (totalScore <= 8) {

                level = "🟡 Moderate Plastic Usage";

                message =
                    "You are doing fairly well, but there are still some habits you can improve.";

            }

            else {

                level = "🔴 High Plastic Usage";

                message =
                    "There is room for improvement. Try reducing single-use plastic in your daily life.";

            }


            document.getElementById("level").textContent = level;

            document.getElementById("message").textContent = message;


            /* --------------------------------
               NEXT ACTION
            -------------------------------- */

            const nextAction = document.getElementById("nextAction");


            if (stage === "after") {

                nextAction.innerHTML = `
                    <p>🎉 Your post-challenge score has been recorded.</p>
                    <a href="dashboard.html" class="primary-btn">
                        View My Results →
                    </a>
                `;

            }

            else {

                nextAction.innerHTML = `
                    <p>🚀 Now take the 7-day Plastic Reduction Challenge.</p>
                    <a href="challenge.html" class="primary-btn">
                        Start 7-Day Challenge →
                    </a>
                `;

            }

        });


        /* --------------------------------
           CHANGE PAGE FOR AFTER SURVEY
        -------------------------------- */

        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get("stage") === "after") {

            document.getElementById("surveyTitle").textContent =
                "Post-Challenge Survey";

            document.getElementById("surveyDescription").textContent =
                "Complete the same survey again after your 7-day challenge to measure your improvement.";

        }

    </script>

</body>
</html>
